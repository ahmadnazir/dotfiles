onboarding = false

[ui]
status_indicators = "symbols"

# How background agent state is announced. The two are flipped as a pair by
# ~/.config/hypr/scripts/herdr-notify-mode.sh, wired to a waybar toggle.
[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Browser-style new tab, like Chrome/Firefox's Ctrl+T
new_tab = ["prefix+c", "ctrl+t"]
# Browser-style tab switching
previous_tab = ["prefix+p", "ctrl+pageup"]
next_tab = ["prefix+n", "ctrl+pagedown"]
# Session navigator (workspace/tab/pane tree with search)
goto = ["prefix+g", "ctrl+shift+/", "ctrl+?"]
# Command palette (search and run any keybound action), like VSCode/Sublime's Ctrl+Shift+P
command_palette = ["prefix+/", "ctrl+shift+p"]

[keys.indexed]
# Browser-style ctrl+1..9 jumps directly to tab N (like Chrome/Firefox tab shortcuts)
tabs = "ctrl"
